name: CI

on:
  push:
    branches: [main, development, v3]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  # Secret scan over the whole history; exceptions live in .gitleaks.toml.
  # The container is used instead of gitleaks-action, which needs a paid
  # licence for organisation repositories.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          git /repo --config /repo/.gitleaks.toml --redact --verbose

  # The dev group includes the [sr25519] extra, so this runs everything.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  # The core must work without the [sr25519] extra. test_extras fakes its
  # absence in-process; here the two packages are really not installed.
  # --no-sync: uv run would put them back.
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-package py-sr25519-bindings --no-install-package rbcl
      - run: uv run --no-sync python -c "import importlib.util as u; raise SystemExit(any(u.find_spec(m) for m in ('sr25519', 'rbcl')))"
      - run: uv run --no-sync pytest -rs

  # End to end against a development node on a recent mainnet runtime: transfers,
  # datalog, and the user story from a funded account to an RWS subscription.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: .devchain
          key: devchain-${{ runner.os }}-${{ hashFiles('scripts/devchain.sh') }}
      - name: Start the development node
        run: |
          scripts/devchain.sh > node.log 2>&1 &
          timeout 180 bash -c 'until (echo > /dev/tcp/127.0.0.1/9944) 2>/dev/null; do sleep 1; done'
      - run: uv run pytest -m integration -v
        env:
          ROBONOMICS_DEV_URL: ws://127.0.0.1:9944
      - if: failure()
        run: tail -200 node.log

  # Home Assistant runs on Alpine (musl) and, on Raspberry Pi and HA Green, on
  # aarch64. Every dependency must install there from a wheel or as pure
  # Python, with no compiler. This job is the guard: the image has no
  # toolchain, and --only-binary refuses anything that would need one. The
  # tests run twice: on the core alone (sr25519 tests skip), then with the
  # [sr25519] extra. x86_64 covers Home Assistant on generic hardware.
  alpine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04-arm, arch: aarch64}
          - {runner: ubuntu-latest, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel
      - name: Install and test in python:3.13-alpine
        run: |
          docker run --rm -e ARCH=${{ matrix.arch }} -v "$PWD:/src:ro" -w /src python:3.13-alpine sh -euxc '
            uname -m | grep -qx "$ARCH"
            [ -z "$(command -v gcc)" ] && [ -z "$(command -v cc)" ]
            python -m venv /venv
            pip="/venv/bin/pip install --no-cache-dir --only-binary=:all:"
            test_="/venv/bin/python -m pytest -p no:cacheprovider --rootdir=/src /src/tests"
            wheel=$(ls dist/*.whl)
            $pip "$wheel" pytest pytest-asyncio
            /venv/bin/python -c "import importlib.util as u, sys; raise SystemExit(any(map(u.find_spec, sys.argv[1:])))" sr25519 rbcl
            (cd /tmp && $test_ -rs)
            $pip "$wheel[sr25519]"
            (cd /tmp && $test_ -rs)
          '
