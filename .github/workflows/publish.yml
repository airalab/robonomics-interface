name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Uploads with the maintainer's PyPI token, the repository secret
  # PYPI_API_TOKEN that 2.x releases used. The `pypi` environment is where
  # required reviewers can be set, so a tag waits for approval before upload.
  # To move to Trusted Publishing later, a PyPI owner registers this workflow
  # and environment; then drop `password` and grant `id-token: write` instead.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
