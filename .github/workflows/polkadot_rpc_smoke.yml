name: Polkadot RPC Smoke

on:
  schedule:
    - cron: "20 4 1 * *"

permissions:
  contents: read

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

concurrency:
  group: polkadot-rpc-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: 3.9
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.5
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    - name: Install dependencies
      run: poetry install --no-interaction
    - name: Run read-only Polkadot RPC smoke tests
      env:
        ROBONOMICS_RPC_URL: ${{ vars.ROBONOMICS_RPC_URL }}
      run: poetry run pytest --run-integration -m "integration and smoke" tests/integration
