name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["docs/**", "src/**", "README.md", "MIGRATION.md", "CHANGELOG.md", "pyproject.toml"]

permissions:
  contents: write # gh-pages push; pull requests only build

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group docs
      - run: uv run sphinx-build -W --keep-going -b html docs/source docs/build

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
